plugins {
    id 'com.android.application'
}

// 版本号先算好、再传进去。
// ⚠️ 不能写成 versionCode (表达式).intValue()：
//    Groovy 会理解成"先调 versionCode(...)，再对它的返回值调 intValue()"，
//    而 versionCode 返回 void，会直接抛错（这个坑已经让云端编译失败过一次）。
def buildVersionCode = (System.currentTimeMillis() / 1000L).intValue()
def buildVersionName = System.getenv("VERSION_NAME") ?: "0.1"

android {
    namespace 'com.xiaolin.moneybook'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiaolin.moneybook"
        minSdk 24              // Android 7.0，覆盖绝大多数在用手机
        targetSdk 34
        // 用"当前时间戳（秒）"当版本号：每次编译都比上一版大，
        // 安卓才允许"覆盖安装"并保留账目数据 —— 这是升级不丢数据的前提。
        // 秒级时间戳上限 2100000000，够用到 2036 年。
        versionCode buildVersionCode
        versionName buildVersionName
    }

    // 固定签名：云端第一次编译时生成并提交到仓库，之后每次都用它。
    // 这样出新版本可以直接覆盖安装，账目数据不会丢。
    signingConfigs {
        fixed {
            def ks = file('../keystore.jks')
            if (ks.exists()) {
                storeFile ks
                storePassword 'moneybook123'
                keyAlias 'moneybook'
                keyPassword 'moneybook123'
            }
        }
    }

    buildTypes {
        debug {
            // 自用调试版：不混淆，方便看崩溃日志
            minifyEnabled false
            // 密钥还没生成出来时，回退到系统默认调试签名，保证编译不中断
            if (file('../keystore.jks').exists()) {
                signingConfig signingConfigs.fixed
            }
        }
        release {
            minifyEnabled false
            if (file('../keystore.jks').exists()) {
                signingConfig signingConfigs.fixed
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 这是刻意不引任何第三方库的：依赖越少，云端编译失败的概率越低
}

dependencies {
    // 故意留空。WebView 是系统自带的，不需要 androidx 或任何库。
}
